# .github/dependabot.yml
#
# OWASP A03 (Software Supply Chain Failures): the CI job's `npm audit` (ci.yml) catches a
# known-vulnerable dependency the moment it's introduced; Dependabot is the complementary,
# always-on side of the same problem - it opens a PR the moment a *new* advisory is published
# against something already in the tree, even if nobody touches that package.json again.
# Neither replaces the other.
#
# npm-ecosystem entries for all four package.json locations: the two that exist today
# (app/api, app/web - the working local demo) and the two that don't yet (v2/api, v2/web -
# the real backend/frontend context.md describes, scaffolded ahead of the code per this
# task). Dependabot silently no-ops (shows as an errored config check in the repo's
# Dependabot tab, does not fail CI) for a directory/manifest it can't find - so the v2/*
# entries are safe to merge now, but a human should confirm they've gone green once v2/api
# and v2/web actually have a package.json committed. TODO: if v2/api or v2/web end up at
# different paths than assumed here, update `directory` below to match.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - app-api

  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - app-web

  # v2/api does not exist yet - path assumed from context.md's architecture section.
  - package-ecosystem: npm
    directory: /v2/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - v2-api

  # v2/web does not exist yet - path assumed from context.md's architecture section.
  - package-ecosystem: npm
    directory: /v2/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - v2-web

  # GitHub Actions themselves are a supply-chain surface too (a compromised third-party
  # action is a direct path to secrets in this repo's Actions context) - keep the ones this
  # repo pins (actions/checkout, docker/build-push-action, aquasecurity/trivy-action, ...)
  # current. OWASP A03.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
