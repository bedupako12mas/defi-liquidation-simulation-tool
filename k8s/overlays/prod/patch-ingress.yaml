# PLACEHOLDER HOSTNAME - no real domain/DNS/Cloudflare zone exists yet for prod. Replace
# with the real apex/subdomain once one is registered and pointed at Cloudflare (see
# DEPLOYMENT.md). Do not treat "example.invalid" as a real value under any circumstances -
# it's IANA's reserved-for-documentation TLD specifically so it can never resolve.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
spec:
  rules:
    - host: api.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
