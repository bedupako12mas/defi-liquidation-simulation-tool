# .github/workflows/deploy.yml
#
# Staging deploys on push to `staging`, prod deploys on push to `main` - same k8s manifests
# (k8s/base + k8s/overlays/*), different values, per context.md §9. Both jobs are gated on
# ci.yml having succeeded for that exact commit (see the `workflow_run` trigger below), so
# there is no path from a red build to a running pod.
#
# Requires these GitHub Actions secrets to exist (a human creates them, see DEPLOYMENT.md):
#   DIGITALOCEAN_ACCESS_TOKEN  - DO API token, scoped to registry + Kubernetes
#   DOKS_CLUSTER_NAME_STAGING  - the real staging cluster's name (doctl kubernetes cluster list)
#   DOKS_CLUSTER_NAME_PROD     - the real prod cluster's name
#   DOCR_REGISTRY              - e.g. registry.digitalocean.com/<your-registry-name>
# The application's own runtime secrets (RPC_URL_MAINNET, DATABASE_URL) never pass through
# this workflow - they're injected into the pod directly (Vault, or the temporary
# kubectl-created Secret documented in k8s/base/deployment.yaml), never via Actions. This
# workflow's DIGITALOCEAN_ACCESS_TOKEN is a CI-scoped infra credential (lets Actions reach
# the DOKS control plane to apply manifests) - a different thing from the app's own secrets,
# and conflating the two would mean app secrets transit CI logs/context (context.md §10).

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging, main]

permissions:
  contents: read

# One deploy in flight per environment at a time - a second push landing mid-rollout should
# queue, not race the first (OWASP A06 - Insecure Design: concurrent `kubectl apply` against
# the same overlay from two runs is exactly the kind of race that produces a half-applied,
# hard-to-diagnose cluster state).
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging'
    environment: staging # a human configures required reviewers / protection rules on this GitHub Environment - see DEPLOYMENT.md
    env:
      REGISTRY: ${{ secrets.DOCR_REGISTRY }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # deploy the exact commit CI just validated, not whatever HEAD has drifted to since

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate Docker to DOCR
        run: doctl registry login --expiry-seconds 600

      - name: Build and push image
        run: |
          docker build -t "$REGISTRY/api:$IMAGE_TAG" -f api/Dockerfile api
          docker push "$REGISTRY/api:$IMAGE_TAG"
          echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/api:$IMAGE_TAG")" >> "$GITHUB_ENV"

      - name: Authenticate to DOKS
        run: doctl kubernetes cluster kubeconfig save "${{ secrets.DOKS_CLUSTER_NAME_STAGING }}"

      - name: Set image and apply staging overlay
        run: |
          cd k8s/overlays/staging
          # kustomize edit set image writes into this CI-local checkout only, never commits
          # back - k8s/overlays/staging/kustomization.yaml in git never carries a real image
          # reference (see the comment in that file).
          npx kustomize edit set image api="$DIGEST"
          kubectl apply -k .
          kubectl rollout status deployment/api -n liquidation-sim-staging --timeout=120s

  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    environment: prod # a human configures required reviewers on this GitHub Environment - a manual approval gate in front of every prod deploy (see DEPLOYMENT.md)
    env:
      REGISTRY: ${{ secrets.DOCR_REGISTRY }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate Docker to DOCR
        run: doctl registry login --expiry-seconds 600

      - name: Build and push image
        run: |
          docker build -t "$REGISTRY/api:$IMAGE_TAG" -f api/Dockerfile api
          docker push "$REGISTRY/api:$IMAGE_TAG"
          echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/api:$IMAGE_TAG")" >> "$GITHUB_ENV"

      - name: Authenticate to DOKS
        run: doctl kubernetes cluster kubeconfig save "${{ secrets.DOKS_CLUSTER_NAME_PROD }}"

      - name: Set image and apply prod overlay
        run: |
          cd k8s/overlays/prod
          npx kustomize edit set image api="$DIGEST"
          kubectl apply -k .
          kubectl rollout status deployment/api -n liquidation-sim-prod --timeout=120s
