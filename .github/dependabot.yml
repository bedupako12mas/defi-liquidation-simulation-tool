# .github/dependabot.yml
#
# OWASP A03 (Software Supply Chain Failures): the CI job's `npm audit` (ci.yml) catches a
# known-vulnerable dependency the moment it's introduced; Dependabot is the complementary,
# always-on side of the same problem - it opens a PR the moment a *new* advisory is published
# against something already in the tree, even if nobody touches that package.json again.
# Neither replaces the other.
#
# npm-ecosystem entries for this repo's two package.json locations (api, web).
# app/api and app/web do NOT exist here - this is the public repo, and app/ (the local demo)
# was deliberately excluded from it, kept only in the private working checkout. An earlier
# version of this file still had app/* entries (leftover from before that exclusion decision
# existed), which Dependabot silently no-ops on but is confusing noise - removed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - api

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - web

  # GitHub Actions themselves are a supply-chain surface too (a compromised third-party
  # action is a direct path to secrets in this repo's Actions context) - keep the ones this
  # repo pins (actions/checkout, docker/build-push-action, aquasecurity/trivy-action, ...)
  # current. OWASP A03.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
