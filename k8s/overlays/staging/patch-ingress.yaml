# Real, working hostname - nip.io (139.59.49.28 is the CURRENT cluster's real ingress-nginx
# LoadBalancer IP as of 2026-09-14; the cluster was rebuilt and a new LB provisioned, which is
# why this replaced the previous 64.225.85.246 - see docs/decisions.md). Deliberately not a
# registered domain behind Cloudflare (see the tech-stack decisions entry: Cloudflare needs a
# real domain, which doesn't exist yet - explicitly deferred, not an oversight). This was
# previously a live-only kubectl patch that a real CI/CD deploy then silently overwrote on
# every push - committing the real value here is what actually fixes that, not another live
# patch. If this cluster is ever torn down and rebuilt again, re-run `kubectl get svc -n
# ingress-nginx ingress-nginx-controller` and update both this file and prod's the same way.
#
# REAL BUG, CAUGHT LIVE: this host was previously the BARE domain (64-225-85-246.nip.io,
# no "staging." prefix) - identical to what a request with no matching Host header falls
# through to, since prod's ingress only explicitly matches "prod.64-225-85-246.nip.io".
# That meant anything hitting the bare domain silently landed on STAGING, not prod - and
# the deployed Vercel frontend's NEXT_PUBLIC_API_BASE was set to exactly that bare domain,
# so the live site was reading staging's (stale/incomplete) data the whole time, not
# prod's, with no error or indication anything was wrong (both respond 200 with a real,
# well-formed MetaResponse - just from different databases with different sync history).
# Fixed to genuinely mirror prod's own naming convention.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  rules:
    - host: staging.139-59-49-28.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
  tls:
    - hosts:
        - staging.139-59-49-28.nip.io
      secretName: api-tls-staging
