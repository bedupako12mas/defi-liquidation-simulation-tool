# Strategic merge patch over k8s/base/deployment.yaml - staging values only.
# context.md §9: "staging points at a testnet or a pinned historical block; prod at
# mainnet" - that RPC/chain config is application-level env, not a k8s concern, and belongs
# in whatever config api actually reads (env var, Vault-injected file - TBD once api
# exists). What's set here is purely infra sizing: staging runs a single small replica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: staging
            - name: ALLOWED_ORIGINS
              # Real, live-caught gap (2026-09-14): this was never set for staging - CORS
              # (@fastify/cors, server.ts) fails closed on an unset/empty origin, so every
              # browser fetch from the Vercel Preview deployment would have silently failed
              # while curl-based health checks looked fine (CORS is browser-only - same
              # class of gotcha prod's own ALLOWED_ORIGINS comment already describes).
              # This is Vercel's stable git-branch alias for `staging`, not a per-deploy
              # Preview URL (those get a random hash per build and would break every push).
              value: "https://defi-liquidation-simulation-tool-git-staging-arun-cb84.vercel.app"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "250m"
              memory: "192Mi"
