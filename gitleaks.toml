# gitleaks.toml
#
# Config for gitleaks (https://github.com/gitleaks/gitleaks), run in CI against the FULL git
# history, not just the current diff - see the "gitleaks (full history)" job added in
# .github/workflows/ci.yml for why that distinction matters (short version: a secret that
# was committed and later "removed" in a follow-up commit is still sitting in a git object
# forever, reachable by anyone who clones the repo and runs `git log -p`, until history is
# rewritten - a diff-only scan on the latest commit would never see it).
#
# Extends gitleaks' own maintained default ruleset (AWS keys, GitHub/GitLab tokens, private
# key blocks, generic high-entropy secrets, etc.) rather than re-inventing pattern coverage -
# that ruleset is broader and better-maintained than anything worth hand-rolling here.
title = "liquidation-simulator gitleaks config"

[extend]
useDefault = true

# No [[rules]] additions yet - none of this project's known constants (contract addresses,
# public RPC endpoints, chain IDs, Aave/Fluid protocol parameters per context.md §4/§5) look
# secret-shaped, so the default ruleset's false-positive surface here should be small. Add a
# project-specific rule here if a real proprietary secret format shows up later (e.g. a
# BetterStack or Vault-issued token with a recognizable prefix) - don't add one speculatively
# for a format that doesn't exist yet.
#
# UPDATE 2026-09-10 (live-caught, not hypothetical): the prediction above turned out wrong
# for one specific shape. The default `generic-api-key` rule's high-entropy heuristic flags
# real, PUBLIC Ethereum addresses (0x + 40 hex chars) throughout this codebase's mock data
# and investigation scripts - 15 real findings on the first full-history CI run, all of them
# real on-chain contract/token addresses (e.g. a real wstETH token address), none of them
# actual secrets. Addresses are inherently high-entropy-looking 40-hex-char strings, and a
# blockchain-heavy codebase is full of them by design - allowlisted by regex below rather
# than allowlisting each new address's commit/line individually, since new real addresses
# will keep getting added as this project grows.

[allowlist]
description = "Paths and patterns that are expected to contain synthetic/public data, not real secrets"
paths = [
  # app/api/src/fixtures - explicitly synthetic data per docs/demo/DEMO_GUIDE.md §2
  # ("Everything under fixtures/ is synthetic scaffolding"). Not a secrets concern, but
  # excluding it avoids gitleaks wasting time/false-positives on large generated fixture
  # files.
  '''app/api/src/fixtures/.*''',
  # Example/template env files are meant to show variable *names*, not real values - see
  # the .gitignore carve-out for .env.example / .env.*.example.
  '''\.env\.example$''',
  '''\.env\..*\.example$''',
]
regexes = [
  # Standard 20-byte Ethereum address (0x + 40 hex chars, EIP-55 checksummed or not) - real,
  # public on-chain data (contract/token/vault addresses), never a secret by construction.
  # See the UPDATE comment above for the real, live-caught finding this closes.
  '''^0x[a-fA-F0-9]{40}$''',
]
